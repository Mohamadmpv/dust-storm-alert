name: Marine Data Collection
on:
  schedule:
    - cron: '0 */6 * * *' # هر 6 ساعت
  workflow_dispatch:

jobs:
  collect-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Run Marine Data Collector
        run: python marine_data.py
      
      # ذخیره تغییرات فایل CSV در گیت‌هاب
      - name: Commit and push CSV
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add persian_gulf_marine_data.csv
          git commit -m "Update marine data CSV" || echo "No changes to commit"
          git push
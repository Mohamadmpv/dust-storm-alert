name: Test Antarctica Token

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests python-dotenv
      - name: Test Token
        env:
          ANTARCTICA_TELEGRAM_TOKEN: ${{ secrets.ANTARCTICA_TELEGRAM_TOKEN }}
        run: python test_antarctica.py
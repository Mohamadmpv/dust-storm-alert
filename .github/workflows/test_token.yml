name: Test Bale Token

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test token
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
        run: python test_bale_token.py
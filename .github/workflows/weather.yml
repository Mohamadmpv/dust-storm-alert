name: Weather Report

on:
  schedule:
    # هر ۱۲ ساعت - ساعت 6 صبح و 6 عصر تهران
    - cron: '30 2 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch:

jobs:
  weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Send weather report
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_IDS }}
          BALE_CHAT_IDS: ${{ secrets.BALE_CHAT_IDS }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python weather_report.py